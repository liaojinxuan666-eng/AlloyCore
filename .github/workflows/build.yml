name: Build AlloyCore TestApp

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Patch project object version (fix Xcode 15.4 compatibility)
      run: |
        # 强制将工程文件版本从 77 降级到 56
        sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' AlloyCore.xcodeproj/project.pbxproj
        # 顺便把 Xcode 兼容版本也改一下，防止其他报错
        sed -i '' 's/LastUpgradeCheck = 1600;/LastUpgradeCheck = 1540;/g' AlloyCore.xcodeproj/project.pbxproj

    - name: Build TestApp
      run: |
        CODE_SIGNING_ALLOWED=NO xcodebuild \
          -project AlloyCore.xcodeproj \
          -scheme TestApp \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 16' \
          -derivedDataPath build \
          build