name: Build AlloyCore TestApp

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Patch project object version (fix Xcode 15.4 compatibility)
      run: |
        sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' AlloyCore.xcodeproj/project.pbxproj
        sed -i '' 's/LastUpgradeCheck = 1600;/LastUpgradeCheck = 1540;/g' AlloyCore.xcodeproj/project.pbxproj

    - name: Build TestApp for iOS Device (Unsigned)
      run: |
        CODE_SIGNING_ALLOWED=NO xcodebuild \
          -project AlloyCore.xcodeproj \
          -scheme TestApp \
          -sdk iphoneos \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -derivedDataPath build \
          build

    - name: Package into IPA
      run: |
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/TestApp.app Payload/
        zip -r TestApp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TestApp-Unsigned-IPA
        path: TestApp.ipa