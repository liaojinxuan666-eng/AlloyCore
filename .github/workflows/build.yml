name: Build AlloyCore TestApp

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.4.app

    - name: Build TestApp
      run: |
        # 这里假设你本地有 Xcode 工程，Actions 才能编译。如果只是 SwiftPM 包，命令不同。
        # 如果是 Xcode 工程，大概类似这样：
        xcodebuild -project TestApp.xcodeproj \
          -scheme TestApp \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          build